name: Desktop build

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to build
        required: true
        type: string
      upload-artifacts:
        description: Upload packages for the release draft
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      BUILD_TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.platform == 'windows-x86_64' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Rust from Cargo.toml
        id: toolchain
        shell: bash
        run: |
          RUST_VERSION="$(python -c "from tools.release.artifacts import package_info; print(package_info()['rust-version'])")"
          echo "rust=$RUST_VERSION" >> "$GITHUB_OUTPUT"
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --target "$BUILD_TARGET"
          rustup override set "$RUST_VERSION"
      # Keep registry sources with target so their modification times survive
      # restoration. Cache the compiled Rust and native-code dependencies too.
      - name: Cache Rust sources and build outputs
        id: rust-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/**/incremental
          key: rust-build-v1-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.toolchain.outputs.rust }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '.github/workflows/build.yml', 'tools/release/artifacts.py') }}
          restore-keys: rust-build-v1-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.toolchain.outputs.rust }}-
      - name: Install Ubuntu build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential dpkg-dev xz-utils cmake ninja-build nasm pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-composite0-dev libxcb-damage0-dev libxcb-dpms0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-render0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-xinput-dev libxcb-xkb-dev libasound2-dev libssl-dev
      - name: Check Rust formatting
        shell: bash
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path crates/rustrdp/Cargo.toml --check
      - name: Test release packaging
        shell: bash
        run: python -m unittest discover -s tools/release -p test_release.py
      - name: Test and package Ubuntu
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p rustrdp
          cargo test --manifest-path crates/rustrdp/Cargo.toml --target-dir target --no-default-features
          cargo test --manifest-path crates/rustrdp/Cargo.toml --target-dir target --all-features
          cargo test --locked --lib rdp::
          cargo test --locked --bin rustterm app::rdp_view::
          cargo test --locked --lib update::
          cargo test --locked --lib config::
          cargo test --locked --lib session::local::
          cargo test --locked --lib docker::
          cargo test --locked --test docker
          python3 -m unittest discover -s src/update/installer -p test_install.py
          tools/release/package-linux.sh --release
          python3 tools/release/artifacts.py binary-version target/release/rustterm
          ldd target/release/rustterm > dist/linked-libraries.txt
          if grep -q 'not found' dist/linked-libraries.txt; then cat dist/linked-libraries.txt; exit 1; fi
          rm dist/linked-libraries.txt
      - name: Package Windows with the MSVC toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 build tools are missing' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          choco install nasm --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
          $env:PATH = "${env:ProgramFiles}\NASM;$env:PATH"
          cargo test --locked -p rustrdp
          if ($LASTEXITCODE -ne 0) { throw 'RDP protocol tests failed' }
          python tools/release/artifacts.py package-windows --release --output dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
      - if: inputs.upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
