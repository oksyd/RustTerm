[package]
name = "rustrdp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
description = "Transport-independent RDP client protocol engine"
readme = "README.md"
repository = "https://github.com/oksyd/RustTerm"
documentation = "https://docs.rs/rustrdp"
keywords = ["rdp", "remote-desktop", "protocol", "sans-io"]
categories = ["network-programming", "parser-implementations"]
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = []
graphics = ["dep:openh264"]
audio-codecs = ["dep:symphonia-core", "dep:symphonia-codec-aac", "dep:symphonia-codec-adpcm", "dep:fdk-aac"]
licensing = ["dep:rsa", "dep:md-5", "dep:sha1", "dep:sha2", "dep:rc4", "dep:x509-cert", "dep:zeroize", "dep:subtle"]

[dependencies]
fdk-aac = { version = "0.8.0", default-features = false, optional = true }
openh264 = { version = "0.9.9", default-features = false, features = ["source"], optional = true }
symphonia-core = { version = "0.6.1", default-features = false, optional = true }
symphonia-codec-aac = { version = "0.6.1", default-features = false, optional = true }
symphonia-codec-adpcm = { version = "0.6.1", default-features = false, optional = true }
rsa = { version = "0.9.10", default-features = false, features = ["std", "hazmat", "u64_digit"], optional = true }
md-5 = { version = "0.11.0", default-features = false, features = ["zeroize"], optional = true }
sha1 = { version = "0.11.0", default-features = false, features = ["zeroize"], optional = true }
sha2 = { version = "0.11.1", default-features = false, optional = true }
rc4 = { version = "0.1.0", default-features = false, features = ["zeroize"], optional = true }
x509-cert = { version = "0.2.5", default-features = false, features = ["std"], optional = true }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"], optional = true }
subtle = { version = "2.6.1", default-features = false, optional = true }

[lints.rust]
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "warn"
